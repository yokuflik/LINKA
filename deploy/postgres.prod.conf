# Postgres 15 tuning for the 1 GB single-host demo (ADR 0007).
# Mounted read-only at /etc/postgresql/postgresql.conf; the container is
# started with `-c config_file=` pointing here.
#
# These numbers are deliberately tiny. The app pool is capped at
# DB_POOL_SIZE=5 and there is one app instance, so ~30 real connections max.

listen_addresses = '*'

max_connections = 50
shared_buffers = 128MB
effective_cache_size = 384MB
work_mem = 4MB
maintenance_work_mem = 32MB
wal_buffers = 4MB

# SSD-ish random reads on EBS.
random_page_cost = 1.5
effective_io_concurrency = 200

# Keep WAL small on a tiny disk.
min_wal_size = 128MB
max_wal_size = 512MB
checkpoint_completion_target = 0.9

# Autovacuum a bit more eager: the partitioned messages / receipt-log tables
# churn, and a stalled autovacuum on a small box shows up fast.
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# Log slow queries only.
log_min_duration_statement = 500
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
timezone = 'UTC'
datestyle = 'iso, mdy'
