# Production / demo stack for a single 1 GB free-tier host (ADR 0007).
#
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# Only Caddy publishes ports (80/443). Postgres, Redis and MinIO are reachable
# only on the internal compose network. Every stateful service has a named
# volume and a memory ceiling. See deploy/README.md for first-boot steps.

name: linka

x-restart: &restart
  restart: unless-stopped

services:
  caddy:
    image: caddy:2-alpine
    <<: *restart
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./poc:/srv/poc:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 64m
    depends_on:
      app:
        condition: service_started
      ws_gateway:
        condition: service_started

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: linka-app:latest
    <<: *restart
    env_file: .env
    environment:
      # Container-internal service names override whatever the .env points at
      # for local dev, so one .env works for both `exec` scripts and the app.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      # Rust Snowflake ID service (ADR 0011). Empty -> in-process generator.
      ID_SERVICE_ADDR: id_service:50051
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      id_service:
        condition: service_healthy
    mem_limit: 320m
    # Locked to one core for the demo box (business answer 2, 2026-09-06).
    # Bump when real load needs it; the app is multi-worker-safe (all rate
    # limits live in Redis, ADR 0012).
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  id_service:
    build:
      context: .
      dockerfile: id_service/Dockerfile
    image: linka-id-service:latest
    <<: *restart
    environment:
      # 10-bit node id, unique per running replica (only one here). Must differ
      # from the app's SNOWFLAKE_MACHINE_ID fallback to stay collision-free.
      NODE_ID: "2"
    mem_limit: 32m
    healthcheck:
      test: ["CMD", "/bin/grpc_health_probe", "-addr=localhost:50051"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3

  # Rust WebSocket gateway (ADR 0033). Replaces only the FastAPI /ws endpoint;
  # speaks the existing Redis contract unchanged. Caddy routes /ws here and
  # /ws-legacy to `app` during the canary. Image is built off-host and pulled
  # (see deploy/ws_gateway.Dockerfile + deploy/README.md) — `build:` is kept
  # only for local `docker compose build ws_gateway` on a dev machine.
  ws_gateway:
    build:
      context: .
      dockerfile: deploy/ws_gateway.Dockerfile
    image: ${WS_GATEWAY_IMAGE:-linka-ws-gateway:latest}
    <<: *restart
    environment:
      REDIS_URL: redis://redis:6379/0
      # The gateway verifies the same HS256 tokens the app issues.
      JWT_SECRET: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
      APP_INTERNAL_URL: http://app:8000
      WS_GATEWAY_BIND: 0.0.0.0:8081
      # SERVER_ID is deliberately unset: the gateway self-generates a per-process
      # UUID, so a restart's stale routing registrations simply TTL out.
      # APP_SERVER_ID (ADR 0041) is the *app*'s SERVER_ID (from .env), not the
      # gateway's own - it keys app_worker_alive:{id}, the liveness signal
      # checked before acking send_message / mark_*.
      APP_SERVER_ID: ${SERVER_ID:?set SERVER_ID in .env}
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_started
    mem_limit: 64m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "/ws_gateway", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  db:
    image: postgres:15-alpine
    <<: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres.prod.conf:/etc/postgresql/postgresql.conf:ro
    mem_limit: 320m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    <<: *restart
    # volatile-lru: only keys with a TTL (OTP, presence, refresh tokens) are
    # evictable under pressure; the Redis Streams (capped by MAXLEN via env)
    # and consumer groups are never dropped. AOF so a restart keeps sessions.
    command:
      - "redis-server"
      - "--maxmemory"
      - "128mb"
      - "--maxmemory-policy"
      - "volatile-lru"
      - "--appendonly"
      - "yes"
    volumes:
      - redisdata:/data
    mem_limit: 160m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    <<: *restart
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  minio_data:
  caddy_data:
  caddy_config:
