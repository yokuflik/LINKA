<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linka — WebSocket PoC</title>

<!--
  Single-file proof of concept. No build step - open this file directly,
  or serve it with any static file server.

  IMPORTANT — this was written against Linka's ACTUAL implemented API, which
  differs from the spec this was requested against in a few places. Deviations,
  and why:

    - Auth endpoints are POST /auth/otp/request and /auth/otp/verify
      (not /auth/request-otp / /auth/verify-otp).
    - POST /chats/private takes { other_user_id }, not { target_user_id }.
    - Group creation is POST /chats/groups (plural) with { title,
      initial_member_ids }, not /chats/group with { member_ids }.
    - The WebSocket send payload's top-level action key is "type"
      (e.g. "send_message"), not "action" - "type" is also (separately) a
      field *inside* that payload for the message's content type (1=text),
      renamed here to "message_type" to avoid colliding with the action key:
        { "type": "send_message", "chat_id": 1, "client_message_id": "...",
          "content": "hi", "message_type": 1 }
    - Real-time events pushed over the socket are flat, not wrapped in
      {event, data}: { "event": "new_message", "chat_id": ..., "message_id": ...,
      "sender_id": ..., "type": ..., "content": ..., "created_at": ... }.
      Acks/errors from your own actions use a "type" key instead of "event"
      ({"type":"ack",...} / {"type":"error",...}) - see handleWsMessage().
      There's also an "added_to_chat" event: { "event": "added_to_chat",
      "chat_id": ... }, pushed to *both* sides right when a private chat is
      created (or to new group members) - the server has already brought
      this connection's live subscription up to date by the time it arrives,
      so the client-side handler here just refreshes the chat list.

  Also: the server had no CORS headers at all before this PoC was written -
  see main.py's CORSMiddleware (dev-only, wide open by default).

  IMPORTANT — every id (user/chat/message) is a 64-bit Snowflake, and the
  server sends every one of them as a JSON STRING, not a JSON number. This
  isn't stylistic: JSON.parse decodes numbers as IEEE-754 doubles, which
  only represent integers exactly up to 2^53-1 (~9 quadrillion) - our ids
  are ~3.5*10^17, so ~95% of them get silently corrupted the instant a
  browser parses one as a Number. This is exactly what broke private-chat
  creation the first time this was tested: a corrupted id pointed at a user
  that doesn't exist, and the add-participant call failed silently.
  Never call parseInt()/Number()/`+id` on an id anywhere in this file -
  keep them as opaque strings end to end (comparison, JSON.stringify, and
  putting them in a URL path all work fine on strings; the server parses a
  numeric string back to an exact int with no special handling needed).
-->

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<!-- Structural split into child components (see CLAUDE.md) - plain
     Vue.defineComponent objects loaded as sibling scripts, since this PoC
     has no build step and can't use .vue SFCs. All business logic/state
     stays in the root app below; these only own template markup. -->
<script src="components/AuthScreen.js"></script>
<script src="components/AppHeader.js"></script>
<script src="components/ChatSidebar.js"></script>
<script src="components/ChatHeader.js"></script>
<script src="components/MessageList.js"></script>
<script src="components/MessageInput.js"></script>
<script src="components/MembersModal.js"></script>
<script src="components/ToastList.js"></script>
<style>
  /* Chat-bubble speech tail (WhatsApp-style), drawn with a CSS triangle
     instead of an image so it inherits the bubble's own background color. */
  .bubble-tail { position: relative; }
  .bubble-tail::after {
    content: '';
    position: absolute;
    bottom: 0;
    width: 0;
    height: 0;
    border-bottom: 8px solid transparent;
  }
  .bubble-tail-mine::after {
    right: -6px;
    border-left: 8px solid #0f766e; /* teal-700, matches bg-teal-700 */
  }
  .bubble-tail-theirs::after {
    left: -6px;
    border-right: 8px solid #ffffff; /* matches bg-white */
  }
</style>
</head>
<body class="h-screen bg-slate-100 text-slate-900 antialiased">
<div id="app" class="h-full"></div>

<script>
const { createApp, ref, reactive, computed, onMounted, onBeforeUnmount, nextTick, watch } = Vue;

createApp({
  components: {
    AuthScreen, AppHeader, ChatSidebar, ChatHeader, MessageList, MessageInput, MembersModal, ToastList,
  },
  setup() {
    // ---------------------------------------------------------------
    // Config / logging
    // ---------------------------------------------------------------
    const apiBase = ref(localStorage.getItem('linka_api_base') || 'http://localhost:8000');
    const wsBase = computed(() => apiBase.value.replace(/^http/, 'ws'));

    function log(...args) { console.log('%c[Linka]', 'color:#0e7c90', ...args); }
    function logError(...args) { console.error('[Linka]', ...args); }

    // ---------------------------------------------------------------
    // Auth state
    // ---------------------------------------------------------------
    const accessToken = ref(localStorage.getItem('linka_access_token') || '');
    const refreshToken = ref(localStorage.getItem('linka_refresh_token') || '');
    const currentUser = ref(null);
    const isAuthed = computed(() => !!accessToken.value && !!currentUser.value);

    const authStage = ref('phone'); // 'phone' | 'otp'
    const phoneNumber = ref('');
    const otpCode = ref('');
    const authError = ref('');
    const authBusy = ref(false);

    // ---------------------------------------------------------------
    // REST helper - JSON in/out, Bearer auth, one auto-refresh-and-retry
    // on a 401, console logging on every request/response/error.
    // ---------------------------------------------------------------
    async function apiFetch(path, options = {}) {
      const doFetch = () => {
        const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
        if (accessToken.value) headers['Authorization'] = `Bearer ${accessToken.value}`;
        log('→', options.method || 'GET', path);
        return fetch(`${apiBase.value}${path}`, { ...options, headers });
      };

      let resp;
      try {
        resp = await doFetch();
      } catch (err) {
        logError('network error calling', path, err);
        throw err;
      }

      if (resp.status === 401 && refreshToken.value) {
        log('401 on', path, '- attempting token refresh');
        if (await tryRefresh()) resp = await doFetch();
      }

      if (!resp.ok) {
        let detail = resp.statusText;
        try { detail = (await resp.json()).detail || detail; } catch (_) {}
        logError('←', resp.status, path, detail);
        const err = new Error(detail);
        err.status = resp.status;
        throw err;
      }

      log('←', resp.status, path);
      return resp.status === 204 ? null : resp.json();
    }

    async function tryRefresh() {
      try {
        const resp = await fetch(`${apiBase.value}/auth/refresh`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ refresh_token: refreshToken.value }),
        });
        if (!resp.ok) throw new Error(`refresh rejected (${resp.status})`);
        const body = await resp.json();
        accessToken.value = body.access_token;
        refreshToken.value = body.refresh_token;
        localStorage.setItem('linka_access_token', accessToken.value);
        localStorage.setItem('linka_refresh_token', refreshToken.value);
        log('access token refreshed');
        return true;
      } catch (err) {
        logError('refresh failed, logging out:', err.message);
        logout();
        return false;
      }
    }

    // ---------------------------------------------------------------
    // Auth actions
    // ---------------------------------------------------------------
    async function requestOtp() {
      authError.value = '';
      authBusy.value = true;
      try {
        await apiFetch('/auth/otp/request', {
          method: 'POST',
          body: JSON.stringify({ phone_number: phoneNumber.value }),
        });
        authStage.value = 'otp';
        log('OTP requested for', phoneNumber.value, '- no SMS provider is wired up, check the SERVER console/log for the code');
      } catch (err) {
        authError.value = err.message || 'Failed to request code';
      } finally {
        authBusy.value = false;
      }
    }

    async function verifyOtp() {
      authError.value = '';
      authBusy.value = true;
      try {
        const body = await apiFetch('/auth/otp/verify', {
          method: 'POST',
          body: JSON.stringify({ phone_number: phoneNumber.value, code: otpCode.value }),
        });
        accessToken.value = body.access_token;
        refreshToken.value = body.refresh_token;
        currentUser.value = body.user;
        localStorage.setItem('linka_access_token', accessToken.value);
        localStorage.setItem('linka_refresh_token', refreshToken.value);
        log('logged in as', currentUser.value);
        connectWebSocket();
        await loadChats();
      } catch (err) {
        authError.value = err.message || 'Invalid code';
      } finally {
        authBusy.value = false;
      }
    }

    function logout() {
      disconnectWebSocket();
      accessToken.value = '';
      refreshToken.value = '';
      currentUser.value = null;
      chats.value = [];
      messages.value = [];
      activeChatId.value = null;
      presenceSubscribedUserId = null;
      presenceByUserId.value = {};
      typingUsersByChatId.value = {};
      authStage.value = 'phone';
      phoneNumber.value = '';
      otpCode.value = '';
      localStorage.removeItem('linka_access_token');
      localStorage.removeItem('linka_refresh_token');
      log('logged out');
    }

    // ---------------------------------------------------------------
    // WebSocket
    // ---------------------------------------------------------------
    const wsStatus = ref('disconnected'); // disconnected | connecting | connected | error
    let ws = null;
    let wsReconnectTimer = null;
    let heartbeatTimer = null;

    function connectWebSocket() {
      if (ws) { ws.onclose = null; ws.close(); }
      wsStatus.value = 'connecting';
      const url = `${wsBase.value}/ws?token=${encodeURIComponent(accessToken.value)}`;
      log('WS connecting →', url);
      ws = new WebSocket(url);

      ws.onopen = () => {
        wsStatus.value = 'connected';
        log('WS connected');
        heartbeatTimer = setInterval(() => {
          if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'heartbeat' }));
        }, 30000);
        markAllChatsDelivered();

        // A fresh connection means the server-side presence subscription
        // from before (if any) is gone with the old connection - the local
        // "what am I subscribed to" bookkeeping needs resetting before
        // re-subscribing, otherwise subscribeToPresence's "already
        // subscribed to this user, no-op" guard would wrongly skip sending
        // the request on this new socket.
        presenceSubscribedUserId = null;
        const activeItem = chats.value.find((c) => c.chat.id === activeChatId.value);
        if (activeItem && !activeItem.chat.is_group) subscribeToPresenceForChat(activeChatId.value);
      };

      ws.onmessage = (evt) => {
        let msg;
        try { msg = JSON.parse(evt.data); } catch (err) { logError('WS message was not valid JSON:', evt.data); return; }
        log('WS ←', msg);
        handleWsMessage(msg);
      };

      ws.onerror = (evt) => {
        wsStatus.value = 'error';
        logError('WS error', evt);
      };

      ws.onclose = (evt) => {
        log('WS closed, code =', evt.code, 'reason =', evt.reason || '(none)');
        wsStatus.value = 'disconnected';
        if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
        ws = null;
        if (accessToken.value) {
          log('reconnecting in 3s…');
          wsReconnectTimer = setTimeout(connectWebSocket, 3000);
        }
      };
    }

    function disconnectWebSocket() {
      if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = null; }
      if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
      if (ws) { ws.onclose = null; ws.close(); ws = null; }
      wsStatus.value = 'disconnected';
    }

    // Sends a {chat_id, message_id} receipt action ("mark_delivered" or
    // "mark_read") back over the socket - the client-side half of the
    // watermark pattern the server maintains (see crud_participant.
    // recompute_chat_receipt_cursors). Silently a no-op with no open
    // connection - a receipt that never sent just gets caught up next time.
    function sendReceipt(type, chatId, messageId) {
      if (!ws || ws.readyState !== WebSocket.OPEN || messageId == null) return;
      ws.send(JSON.stringify({ type, chat_id: chatId, message_id: messageId }));
    }

    // Catches up "delivered" on every chat's latest message, not just the
    // one that happens to be open - otherwise a login/reconnect only ever
    // marked delivered live (new_message events) or for whichever single
    // chat selectChat() was called on, leaving everything sent while this
    // device was offline stuck at "sent" until each chat was opened by hand.
    function markAllChatsDelivered() {
      for (const item of chats.value) {
        if (item.chat.last_message_id != null) {
          sendReceipt('mark_delivered', item.chat.id, item.chat.last_message_id);
        }
      }
    }

    // ---------------------------------------------------------------
    // Presence (subscribe-on-demand - see CLAUDE.md's presence section)
    //
    // Deliberately NOT a chat_id -> subscription map: the server only ever
    // tracks presence per *user*, one active subscription per watcher, kept
    // alive only as long as that user's 1:1 chat is the one open right now
    // - never for groups (groups have no presence concept at all). This
    // plain variable (not a ref - nothing in the template reads it
    // directly) mirrors that one-active-subscription-at-a-time contract.
    // ---------------------------------------------------------------
    let presenceSubscribedUserId = null;

    // user_id -> {status: 'online'|'offline', last_seen_at: iso-str|null},
    // populated by the initial presence_status pull (on subscribe) and kept
    // current by live presence_update pushes for as long as subscribed.
    const presenceByUserId = ref({});

    function subscribeToPresence(userId) {
      if (presenceSubscribedUserId === userId) return;
      if (presenceSubscribedUserId != null) unsubscribeFromPresence();
      presenceSubscribedUserId = userId;
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'subscribe_presence', user_id: userId }));
      }
    }

    function unsubscribeFromPresence() {
      if (presenceSubscribedUserId == null) return;
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'unsubscribe_presence', user_id: presenceSubscribedUserId }));
      }
      presenceSubscribedUserId = null;
    }

    // Resolves the other participant's id if it isn't cached yet, then
    // subscribes - guarded on activeChatId still matching chatId when the
    // (possibly awaited) resolution finishes, since the user may have
    // already switched to a different (or group) chat in the meantime.
    async function subscribeToPresenceForChat(chatId) {
      if (!privateChatOtherUserId.value[chatId]) await resolvePrivateChatTitle(chatId);
      const otherUserId = privateChatOtherUserId.value[chatId];
      if (otherUserId && activeChatId.value === chatId) subscribeToPresence(otherUserId);
    }

    // "Last seen" is deliberately not shown - only ever "online", or
    // nothing at all when offline.
    function presenceLabelFor(userId) {
      const info = presenceByUserId.value[userId];
      return info && info.status === 'online' ? 'online' : '';
    }

    const activeChatPresenceLabel = computed(() => {
      if (activeChatIsGroup.value || !activeChatId.value) return '';
      const otherUserId = privateChatOtherUserId.value[activeChatId.value];
      return otherUserId ? presenceLabelFor(otherUserId) : '';
    });

    // ---------------------------------------------------------------
    // Typing indicator - fully ephemeral (see CLAUDE.md), no DB persistence,
    // no "typing_stopped" event from the server: each "typing" event we
    // receive just (re)starts a ~5s client-side expiry timer for that
    // (chat_id, user_id) pair, and the entry is dropped when the timer
    // fires. Works for both 1:1 and group chats, unlike presence above.
    // ---------------------------------------------------------------
    const TYPING_EXPIRY_MS = 5000;
    // How often we're willing to send our own "typing" event while the user
    // keeps typing without pausing - matches the receiving side's expiry so
    // a steady typist never has their indicator lapse on other clients.
    const TYPING_SEND_THROTTLE_MS = 3000;

    // chat_id -> Map<user_id, expiry timeout handle>, who's currently typing
    // in each chat we know about (not just the active one - a background
    // chat's count could still matter if the UI ever surfaces it there too).
    const typingUsersByChatId = ref({});
    let lastTypingSentAt = 0;

    function noteUserTyping(chatId, userId) {
      const existing = typingUsersByChatId.value[chatId] || {};
      if (existing[userId]) clearTimeout(existing[userId]);
      const timeoutHandle = setTimeout(() => {
        const current = { ...(typingUsersByChatId.value[chatId] || {}) };
        delete current[userId];
        typingUsersByChatId.value = { ...typingUsersByChatId.value, [chatId]: current };
      }, TYPING_EXPIRY_MS);
      typingUsersByChatId.value = {
        ...typingUsersByChatId.value,
        [chatId]: { ...existing, [userId]: timeoutHandle },
      };
    }

    // Sends our own "typing" event, throttled so it goes out at most once
    // per TYPING_SEND_THROTTLE_MS while the user keeps typing continuously -
    // called on every keystroke in the message input, not just on send.
    function notifyTyping() {
      if (!activeChatId.value || !ws || ws.readyState !== WebSocket.OPEN) return;
      const now = Date.now();
      if (now - lastTypingSentAt < TYPING_SEND_THROTTLE_MS) return;
      lastTypingSentAt = now;
      ws.send(JSON.stringify({ type: 'typing', chat_id: activeChatId.value }));
    }

    // "X is typing" for exactly one typer, "N people are typing" for more -
    // per product decision, a group never lists multiple names, only a count.
    const activeChatTypingLabel = computed(() => {
      if (!activeChatId.value) return '';
      // Object keys are always strings - ids are kept as opaque strings
      // throughout this file (see the Snowflake/JSON-string note up top),
      // so no Number()/parseInt() coercion here.
      const typists = Object.keys(typingUsersByChatId.value[activeChatId.value] || {})
        .filter((id) => id !== currentUser.value.id);
      if (!typists.length) return '';
      if (typists.length === 1) return `${userLabelById(typists[0])} is typing…`;
      return `${typists.length} people are typing…`;
    });

    function handleWsMessage(msg) {
      // Acks/errors for actions *you* took use "type"; events fanned out
      // from the server (yours or anyone else's) use "event".
      if (msg.type === 'error') { logError('server error:', msg.code, '-', msg.message); return; }
      if (msg.type === 'ack') { log('ack:', msg.for, msg); return; }
      if (msg.type === 'heartbeat_ack') { return; }

      if (msg.type === 'presence_status' || msg.type === 'presence_update') {
        // "Last seen" is intentionally not tracked here - only the current
        // online/offline status (see presenceLabelFor).
        presenceByUserId.value[msg.user_id] = { status: msg.status };
        return;
      }

      if (msg.event === 'new_message') {
        if (msg.chat_id === activeChatId.value) {
          messages.value.push({
            id: msg.message_id, chat_id: msg.chat_id, sender_id: msg.sender_id,
            type: msg.type, content: msg.content, created_at: msg.created_at, is_edited: false,
            status: msg.status,
          });
          nextTick(scrollMessagesToBottom);
        }
        // System messages ("X joined the group", or a private "role_changed"
        // notice - see shouldShowSystemMessage) must never become the
        // sidebar preview: unlike the message stream, the chat list has no
        // per-viewer filtering, so a "role_changed" preview would leak to
        // every participant, not just the actor/target it's meant for.
        if (msg.sender_id != null) {
          bumpChatPreview(msg.chat_id, msg.message_id, msg.created_at, msg.content, msg.status);
        }

        if (msg.sender_id == null) {
          // A system message (e.g. "X joined the group") means this chat's
          // membership just changed - re-pull /chats/{id}/members so the
          // header's participant row and the members modal update live for
          // everyone with this chat loaded, not just whoever triggered it.
          // Only bother for chats whose members were already fetched once
          // (selectChat/openMembersModal) - no point priming ones nobody's
          // looked at yet.
          if (groupChatMembers.value[msg.chat_id]) resolveChatMemberPhones(msg.chat_id);
        }

        if (msg.sender_id !== currentUser.value.id) {
          // The message just reached this device over a live connection -
          // that's "delivered", regardless of which chat is open right now.
          sendReceipt('mark_delivered', msg.chat_id, msg.message_id);
          // "Read" only for the chat actually on screen - opening a chat
          // separately catches up on anything sent while it wasn't (see selectChat).
          if (msg.chat_id === activeChatId.value) sendReceipt('mark_read', msg.chat_id, msg.message_id);
        }
        return;
      }
      if (msg.event === 'typing') {
        // Never our own echo back (the server fans this out to the whole
        // chat, sender included, same as new_message) - and only tracked
        // for chats we actually have state for.
        if (msg.user_id !== currentUser.value.id) noteUserTyping(msg.chat_id, msg.user_id);
        return;
      }
      if (msg.event === 'message_edited') {
        const m = messages.value.find((x) => x.id === msg.message_id);
        if (m) { m.content = msg.content; m.is_edited = true; }
        updateChatPreviewIfLast(msg.chat_id, msg.message_id, msg.content);
        return;
      }
      if (msg.event === 'message_deleted') {
        messages.value = messages.value.filter((x) => x.id !== msg.message_id);
        updateChatPreviewIfLast(msg.chat_id, msg.message_id, null);
        return;
      }
      if (msg.event === 'delivery_receipt' || msg.event === 'read_receipt') {
        // Which of *my* sent messages this actually changed the tick on
        // depends on every other participant's own watermark, not just this
        // one event - simplest correct move is to ask the server, which
        // already recomputed it (see crud_participant.
        // recompute_chat_receipt_cursors), rather than guess client-side.
        if (msg.chat_id === activeChatId.value) refreshMessageStatuses(msg.chat_id);
        return;
      }

      if (msg.event === 'added_to_chat') {
        // Fired for a chat that didn't exist when this WebSocket connected
        // (a brand new private/group chat, or being added to an existing
        // group) - the server has already brought this connection's live
        // subscription up to date on its own end (see
        // ConnectionManager._handle_user_channel_event); refreshing here is
        // just what makes the new chat actually show up in the sidebar.
        log('added to chat', msg.chat_id);
        showToast('New chat');
        loadChats();
        return;
      }

      if (msg.event === 'removed_from_chat') {
        // Mirror of added_to_chat: fired when someone else removes this
        // user from a group (or this user leaves from another device) - the
        // server has already dropped this connection's live subscription to
        // that chat (ConnectionManager._handle_user_channel_event); this is
        // just what makes it disappear from the sidebar without a reload.
        log('removed from chat', msg.chat_id);
        chats.value = chats.value.filter((c) => c.chat.id !== msg.chat_id);
        if (activeChatId.value === msg.chat_id) {
          activeChatId.value = null;
          messages.value = [];
          showMembersModal.value = false;
        }
        // Only toast when someone else did the removing - self-initiated
        // leaves (leaveActiveGroup) already updated this device instantly
        // and don't need to be told about their own action.
        if (msg.actor_id !== currentUser.value.id) {
          const name = msg.chat_title || 'a group';
          showToast(`You were removed from "${name}"`);
        }
        return;
      }

      log('unhandled WS message shape:', msg);
    }

    // ---------------------------------------------------------------
    // Toasts - lightweight, auto-dismissing notifications
    // ---------------------------------------------------------------
    const toasts = ref([]);
    function showToast(text) {
      const id = crypto.randomUUID();
      toasts.value.push({ id, text });
      setTimeout(() => { toasts.value = toasts.value.filter((t) => t.id !== id); }, 4000);
    }

    // Keeps the sidebar's preview line in sync with what the server already
    // wrote to chats.last_message_* when it persisted this message, so it
    // doesn't take a chat-list refresh to see the newest text.
    function bumpChatPreview(chatId, messageId, lastMessageAt, content, status) {
      const item = chats.value.find((c) => c.chat.id === chatId);
      if (!item) return;
      item.chat.last_message_at = lastMessageAt;
      item.chat.last_message_id = messageId;
      item.chat.last_message_preview = content;
      item.chat.last_message_status = status;
      chats.value.sort((a, b) => new Date(b.chat.last_message_at) - new Date(a.chat.last_message_at));
    }

    // Re-pulls just the status field for whatever's currently loaded in the
    // open conversation, after a delivery/read receipt event - see
    // handleWsMessage. Only touches messages the server's page still knows
    // about; older, already-paginated-past history is left alone.
    async function refreshMessageStatuses(chatId) {
      try {
        const page = await apiFetch(`/chats/${chatId}/messages?limit=50`);
        const statusById = new Map(page.map((m) => [m.id, m.status]));
        for (const m of messages.value) {
          if (statusById.has(m.id)) m.status = statusById.get(m.id);
        }
      } catch (err) {
        logError('failed to refresh message statuses for', chatId, err);
      }
    }

    // Mirrors the server-side rule in crud_message: editing or deleting a
    // message only changes a chat's preview when it's the previewed one.
    function updateChatPreviewIfLast(chatId, messageId, content) {
      const item = chats.value.find((c) => c.chat.id === chatId);
      if (item && item.chat.last_message_id === messageId) item.chat.last_message_preview = content;
    }

    // WhatsApp-style timestamp: today is a time, yesterday is a word,
    // anything older is a date.
    function formatChatTime(iso) {
      if (!iso) return '';
      const at = new Date(iso);
      const now = new Date();
      const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      if (at >= startOfToday) return at.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const startOfYesterday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
      if (at >= startOfYesterday) return 'Yesterday';
      return at.toLocaleDateString([], { day: '2-digit', month: '2-digit', year: '2-digit' });
    }

    // ---------------------------------------------------------------
    // Local contact names - a client-only lookup, not backed by anything
    // the server knows. Covers phone numbers "1"-"10" only (there's no
    // registered user with a phone number in that shape); anything else
    // falls through to whatever the server actually said.
    // ---------------------------------------------------------------
    const MOCK_CONTACT_NAMES = {
      '1': 'Daniel Cohen',
      '2': 'Noa Levi',
      '3': 'Avi Mizrahi',
      '4': 'Maya Gold',
      '5': 'Yossi Avraham',
      '6': 'Shira Peretz',
      '7': 'Omer Azulay',
      '8': 'Tamar Mizrahi',
      '9': 'Itay Ben-David',
      '10': 'Roni Katz',
    };

    function contactDisplayName(rawValue) {
      if (rawValue == null) return rawValue;
      return MOCK_CONTACT_NAMES[String(rawValue)] || rawValue;
    }

    // ---------------------------------------------------------------
    // Chats
    // ---------------------------------------------------------------
    const chats = ref([]);
    const activeChatId = ref(null);
    const messages = ref([]);
    const messageInput = ref('');
    const chatsError = ref('');
    const messagesError = ref('');
    const messagesEl = ref(null);

    // chat_id -> the other participant's phone number, for private chats.
    // Resolved lazily via GET /chats/{id}/members (there's no participant
    // info on the chat object itself) and cached here.
    const privateChatTitles = ref({});

    // chat_id -> the other participant's user id, for private chats only -
    // needed (not just their phone number) to send subscribe_presence,
    // which addresses a user by id. Populated alongside privateChatTitles
    // from the same /chats/{id}/members call, so it's "free".
    const privateChatOtherUserId = ref({});

    async function resolvePrivateChatTitle(chatId) {
      if (privateChatTitles.value[chatId]) return;
      try {
        const members = await apiFetch(`/chats/${chatId}/members`);
        const other = members.find((m) => m.user.id !== currentUser.value.id);
        if (other) {
          privateChatTitles.value[chatId] = other.user.phone_number;
          privateChatOtherUserId.value[chatId] = other.user.id;
        }
      } catch (err) {
        logError('failed to resolve private chat title for', chatId, err);
      }
    }

    function chatDisplayName(chat) {
      if (chat.is_group) return chat.title || 'Untitled group';
      const phone = privateChatTitles.value[chat.id];
      return phone ? `Chat with ${contactDisplayName(phone)}` : `Private chat #${chat.id}`;
    }

    // user_id -> that user's UserOut, so a message bubble can show who sent
    // it by name/phone instead of their raw id. Populated from the same
    // /chats/{id}/members endpoint as the private-chat title above, just for
    // every chat (group chats have multiple senders to label, not one).
    const userById = ref({});

    // chat_id -> that chat's member list, straight from /chats/{id}/members -
    // only actually used for group chats, to render the WhatsApp-style
    // participant row under the header.
    const groupChatMembers = ref({});

    async function resolveChatMemberPhones(chatId) {
      try {
        const members = await apiFetch(`/chats/${chatId}/members`);
        for (const m of members) {
          userById.value[m.user.id] = m.user;
        }
        groupChatMembers.value[chatId] = members;
      } catch (err) {
        logError('failed to resolve member phone numbers for', chatId, err);
      }
    }

    function senderLabel(senderId) {
      if (senderId == null) return 'system';
      const user = userById.value[senderId];
      if (!user) return senderId;
      return contactDisplayName(user.phone_number) || user.display_name || user.phone_number;
    }

    function userLabelById(userId) {
      const user = userById.value[userId];
      if (!user) return userId;
      return contactDisplayName(user.phone_number) || user.display_name || user.phone_number;
    }

    // System messages are plain text ("X joined the group") EXCEPT the
    // "role_changed" kind (see chat_service.change_member_role), which is
    // sent as JSON on purpose - unlike every other system message, it's only
    // meant to be seen by the two people involved, not the whole chat, and
    // there's no per-recipient message, so filtering has to happen here.
    function parseSystemMessage(content) {
      if (typeof content !== 'string' || content[0] !== '{') return null;
      try {
        const data = JSON.parse(content);
        return data && typeof data === 'object' ? data : null;
      } catch (_) {
        return null;
      }
    }

    // sender_id == null on a message is what marks it as a system message
    // (see database/models/message.py / SYSTEM_MESSAGE_TYPE) - only that
    // subset is ever checked for the JSON "role_changed" shape.
    function shouldShowSystemMessage(m) {
      if (m.sender_id != null) return true;
      const data = parseSystemMessage(m.content);
      if (!data || data.kind !== 'role_changed') return true;
      const me = currentUser.value.id;
      return data.actor_id === me || data.target_id === me;
    }

    function systemMessageText(m) {
      const data = parseSystemMessage(m.content);
      if (!data) return m.content;
      if (data.kind === 'role_changed') {
        const actorName = data.actor_id === currentUser.value.id ? 'You' : userLabelById(data.actor_id);
        const targetName = data.target_id === currentUser.value.id ? 'you' : userLabelById(data.target_id);
        return data.new_role === 2
          ? `${actorName} made ${targetName} an admin`
          : `${actorName} removed ${targetName} as admin`;
      }
      return m.content;
    }

    const activeChatLabel = computed(() => {
      const item = chats.value.find((c) => c.chat.id === activeChatId.value);
      return item ? chatDisplayName(item.chat) : '';
    });

    const activeChatIsGroup = computed(() => {
      const item = chats.value.find((c) => c.chat.id === activeChatId.value);
      return !!(item && item.chat.is_group);
    });

    // How many names fit before the header would get crowded - the rest
    // collapse into a single "..." marker, same idea as WhatsApp's group row.
    const MAX_VISIBLE_MEMBERS = 8;

    const activeChatMembers = computed(() => {
      return groupChatMembers.value[activeChatId.value] || [];
    });

    const visibleActiveChatMembers = computed(() => activeChatMembers.value.slice(0, MAX_VISIBLE_MEMBERS));

    const hiddenActiveChatMemberCount = computed(() => Math.max(0, activeChatMembers.value.length - MAX_VISIBLE_MEMBERS));

    function memberDisplayName(member) {
      return contactDisplayName(member.user.phone_number) || member.user.display_name || member.user.phone_number;
    }

    // 1=Member, 2=Admin, 3=Owner (see database/models/participant.py) -
    // anything >= 2 can manage members, mirrors chat_service._require_role
    // (min_role=ROLE_ADMIN) on the server so the button only appears where
    // the POST /chats/{id}/members call would actually succeed.
    const ROLE_LABELS = { 1: '', 2: 'Admin', 3: 'Owner' };
    function roleLabel(role) { return ROLE_LABELS[role] || ''; }

    const currentUserRoleInActiveChat = computed(() => {
      const members = activeChatMembers.value;
      const me = members.find((m) => m.user.id === currentUser.value.id);
      return me ? me.role : null;
    });
    const canManageActiveChatMembers = computed(() => (currentUserRoleInActiveChat.value || 0) >= 2);
    // Only an Owner may change roles - mirrors chat_service.change_member_role's
    // _require_role(min_role=ROLE_OWNER) exactly, so this button only shows
    // where the PATCH /chats/{id}/members/{user_id} call would actually succeed.
    const canChangeActiveChatRoles = computed(() => currentUserRoleInActiveChat.value === 3);

    // ---------------------------------------------------------------
    // Group members modal
    // ---------------------------------------------------------------
    const showMembersModal = ref(false);
    const addMemberPhone = ref('');
    const membersModalError = ref('');
    const membersModalBusy = ref(false);

    async function openMembersModal() {
      if (!activeChatId.value) return;
      membersModalError.value = '';
      addMemberPhone.value = '';
      showOwnerTransferPicker.value = false;
      showMembersModal.value = true;
      await resolveChatMemberPhones(activeChatId.value);
    }

    async function addMemberToActiveGroup() {
      membersModalError.value = '';
      const phone = addMemberPhone.value.trim();
      if (!phone) { membersModalError.value = 'Enter a phone number.'; return; }
      membersModalBusy.value = true;
      try {
        // Same two-step flow as createGroupChat: resolve phone -> user id,
        // then POST /chats/{id}/members (server re-checks admin role itself).
        const target = await apiFetch(`/users/by-phone?phone_number=${encodeURIComponent(phone)}`);
        await apiFetch(`/chats/${activeChatId.value}/members`, {
          method: 'POST',
          body: JSON.stringify({ user_id: target.id }),
        });
        addMemberPhone.value = '';
        await resolveChatMemberPhones(activeChatId.value);
      } catch (err) {
        if (err.status === 404) membersModalError.value = `No user with phone number ${phone}`;
        else if (err.status === 409) membersModalError.value = 'User is already a member.';
        else membersModalError.value = err.message;
      } finally {
        membersModalBusy.value = false;
      }
    }

    // Toggles a member between Admin (2) and plain Member (1) - Owner (3) is
    // never a toggle target here, only ever set at group creation.
    // PATCH /chats/{id}/members/{user_id} re-checks ROLE_OWNER server-side,
    // this is just the matching client-side gate (canChangeActiveChatRoles).
    //
    // The server (chat_service.change_member_role) sends a real system
    // message for this, fanned out to the whole chat like any other -  but
    // as structured JSON content with a "role_changed" kind instead of
    // plain text, since this notice is only meant for the actor/target pair,
    // not everyone. See handleWsMessage's parsing and
    // shouldShowSystemMessage() below for the client-side filter.
    async function toggleMemberAdmin(member) {
      if (!canChangeActiveChatRoles.value || member.role === 3) return;
      const chatId = activeChatId.value;
      const newRole = member.role === 1 ? 2 : 1;
      membersModalError.value = '';
      try {
        await apiFetch(`/chats/${chatId}/members/${member.user.id}`, {
          method: 'PATCH',
          body: JSON.stringify({ role: newRole }),
        });
        member.role = newRole;
      } catch (err) {
        if (err.status === 403) membersModalError.value = 'Only the group owner can change roles.';
        else membersModalError.value = err.message;
      }
    }

    // ---------------------------------------------------------------
    // Per-member options popup (click a member's name in the modal) -
    // "Make admin"/"Remove as admin" wired to toggleMemberAdmin above;
    // "Remove from group" wired to memberOptionRemoveFromGroup below.
    // ---------------------------------------------------------------
    const memberOptionsFor = ref(null); // the member object the popup is currently open for, or null

    // Whether the options popup has anything to show for this member at all -
    // used both to gate opening it and to style the row as clickable.
    function hasMemberOptions(member) {
      const canToggleAdmin = canChangeActiveChatRoles.value && member.role !== 3;
      return canToggleAdmin || canRemoveMember(member);
    }

    function openMemberOptions(member) {
      if (!hasMemberOptions(member)) return;
      memberOptionsFor.value = memberOptionsFor.value === member ? null : member;
    }

    async function memberOptionMakeOrRemoveAdmin() {
      const member = memberOptionsFor.value;
      memberOptionsFor.value = null;
      if (member) await toggleMemberAdmin(member);
    }

    // Mirrors chat_service.remove_member's server-side rule: an admin may
    // only remove a plain member - not another admin, and not the owner.
    // Only the owner outranks an admin and can remove one.
    function canRemoveMember(member) {
      if (member.user.id === currentUser.value.id) return false;
      return (currentUserRoleInActiveChat.value || 0) > member.role;
    }

    async function memberOptionRemoveFromGroup() {
      const member = memberOptionsFor.value;
      memberOptionsFor.value = null;
      if (!member || !canRemoveMember(member)) return;
      membersModalError.value = '';
      try {
        await apiFetch(`/chats/${activeChatId.value}/members/${member.user.id}`, { method: 'DELETE' });
        await resolveChatMemberPhones(activeChatId.value);
      } catch (err) {
        if (err.status === 403) membersModalError.value = 'You cannot remove this member.';
        else membersModalError.value = err.message;
      }
    }

    // ---------------------------------------------------------------
    // Leave group - available to every member (not just admins/owner).
    // Same DELETE /chats/{id}/members/{user_id} endpoint as removing
    // someone else, but chat_service.remove_member skips the role check
    // when actor_id === target_user_id.
    //
    // The owner can't just vanish while others remain - chat_service
    // requires a new_owner_id in that case (409 OwnershipTransferRequired
    // otherwise). startLeaveGroup is what decides which path to take;
    // leaveActiveGroup(newOwnerId) does the actual call either way. If the
    // owner is the last one left, there's nobody to transfer to and the
    // server deletes the whole chat instead - same call, no picker needed.
    // ---------------------------------------------------------------
    const leaveGroupBusy = ref(false);
    const showOwnerTransferPicker = ref(false);
    const ownerTransferTargetId = ref('');

    const otherActiveChatMembers = computed(() =>
      activeChatMembers.value.filter((m) => m.user.id !== currentUser.value.id)
    );

    function startLeaveGroup() {
      if (!activeChatId.value) return;
      const others = otherActiveChatMembers.value;
      if (currentUserRoleInActiveChat.value === 3 && others.length) {
        ownerTransferTargetId.value = others[0].user.id;
        showOwnerTransferPicker.value = true;
        return;
      }
      leaveActiveGroup(null);
    }

    function cancelOwnerTransferPicker() {
      showOwnerTransferPicker.value = false;
    }

    async function confirmLeaveWithTransfer() {
      if (!ownerTransferTargetId.value) return;
      await leaveActiveGroup(ownerTransferTargetId.value);
    }

    async function leaveActiveGroup(newOwnerId) {
      if (!activeChatId.value || leaveGroupBusy.value) return;
      if (!newOwnerId && !confirm(`Leave "${activeChatLabel.value}"?`)) return;
      const chatId = activeChatId.value;
      leaveGroupBusy.value = true;
      membersModalError.value = '';
      try {
        const qs = newOwnerId ? `?new_owner_id=${newOwnerId}` : '';
        await apiFetch(`/chats/${chatId}/members/${currentUser.value.id}${qs}`, { method: 'DELETE' });
        showMembersModal.value = false;
        showOwnerTransferPicker.value = false;
        chats.value = chats.value.filter((c) => c.chat.id !== chatId);
        activeChatId.value = null;
        messages.value = [];
      } catch (err) {
        membersModalError.value = err.status === 409 ? 'Name a new owner first.' : err.message;
      } finally {
        leaveGroupBusy.value = false;
      }
    }

    // MessageStatus from the server: 1=sent, 2=delivered, 3=read (see
    // database/models/message.py). Only ever rendered for your own
    // messages - like WhatsApp, there's no such thing as a tick on a
    // message someone else sent you.
    function statusTickSymbol(status) {
      return status >= 2 ? '✓✓' : '✓';
    }
    function statusTickClass(status) {
      return status === 3 ? 'text-sky-500' : 'text-slate-400';
    }

    // messagesEl now refs the MessageList component instance (it exposes
    // its own scrollable element as `messagesEl`) rather than a raw div,
    // since that markup moved into a child component.
    function scrollMessagesToBottom() {
      const el = messagesEl.value && messagesEl.value.messagesEl;
      if (el) el.scrollTop = el.scrollHeight;
    }

    async function loadChats() {
      chatsError.value = '';
      try {
        chats.value = await apiFetch('/chats?limit=50');
        log('loaded', chats.value.length, 'chat(s)');
        await Promise.all(
          chats.value.filter((c) => !c.chat.is_group).map((c) => resolvePrivateChatTitle(c.chat.id))
        );
        // Covers the race with connectWebSocket()'s onopen handler, which
        // also calls this - whichever of the two (socket open, chat list
        // loaded) finishes last is the one that actually has both ready.
        markAllChatsDelivered();
      } catch (err) {
        chatsError.value = err.message;
      }
    }

    async function selectChat(chatId) {
      activeChatId.value = chatId;
      messages.value = [];
      messagesError.value = '';
      const item = chats.value.find((c) => c.chat.id === chatId);
      if (item && !item.chat.is_group) resolvePrivateChatTitle(chatId);
      resolveChatMemberPhones(chatId);

      // Subscribe-on-demand presence: only ever one active subscription,
      // scoped to whichever private chat is open right now - switching away
      // (including to a group, which has no presence at all) unsubscribes
      // first. See CLAUDE.md's presence section for the full contract.
      unsubscribeFromPresence();
      if (item && !item.chat.is_group) subscribeToPresenceForChat(chatId);
      try {
        const history = await apiFetch(`/chats/${chatId}/messages?limit=50`);
        // The API returns newest-first (keyset pagination); the UI wants oldest-first.
        messages.value = history.slice().reverse();
        await nextTick();
        scrollMessagesToBottom();

        // Opening a chat means "I have this device, and I've seen up to
        // here" - catches up on both receipts in one go, including
        // anything sent while this chat wasn't the active one (or wasn't
        // connected at all).
        if (history.length) {
          sendReceipt('mark_delivered', chatId, history[0].id);
          sendReceipt('mark_read', chatId, history[0].id);
        }
      } catch (err) {
        messagesError.value = err.message;
      }
    }

    // ---------------------------------------------------------------
    // New chat / group forms
    // ---------------------------------------------------------------
    const showNewPrivate = ref(false);
    const showNewGroup = ref(false);
    const newPrivatePhone = ref('');
    const newGroupTitle = ref('');
    const newGroupMemberPhones = ref('');
    const chatFormError = ref('');

    async function createPrivateChat() {
      chatFormError.value = '';
      const phone = newPrivatePhone.value.trim();
      if (!phone) { chatFormError.value = 'Enter a phone number.'; return; }
      try {
        // /users/by-phone resolves the number to a user id first - the
        // create-chat endpoint itself still takes other_user_id, it just
        // doesn't know about phone numbers.
        const target = await apiFetch(`/users/by-phone?phone_number=${encodeURIComponent(phone)}`);
        const chat = await apiFetch('/chats/private', {
          method: 'POST',
          body: JSON.stringify({ other_user_id: target.id }),
        });
        privateChatTitles.value[chat.id] = target.phone_number; // already known - skip the round trip
        newPrivatePhone.value = '';
        showNewPrivate.value = false;
        await loadChats();
        await selectChat(chat.id);
      } catch (err) {
        chatFormError.value = err.status === 404 ? `No user with phone number ${phone}` : err.message;
      }
    }

    async function createGroupChat() {
      chatFormError.value = '';
      if (!newGroupTitle.value.trim()) { chatFormError.value = 'Enter a group title.'; return; }
      const phones = newGroupMemberPhones.value
        .split(',')
        .map((s) => s.trim())
        .filter((s) => s.length > 0);
      try {
        // Same two-step flow as creating a private chat: resolve each phone
        // number to a user id first (/chats/groups itself only knows ids).
        const targets = await Promise.all(
          phones.map((phone) => apiFetch(`/users/by-phone?phone_number=${encodeURIComponent(phone)}`).catch((err) => {
            throw err.status === 404 ? new Error(`No user with phone number ${phone}`) : err;
          }))
        );
        const memberIds = targets.map((t) => t.id);
        for (const t of targets) userById.value[t.id] = t; // already known - skip a later round trip

        const chat = await apiFetch('/chats/groups', {
          method: 'POST',
          body: JSON.stringify({ title: newGroupTitle.value.trim(), initial_member_ids: memberIds }),
        });
        newGroupTitle.value = '';
        newGroupMemberPhones.value = '';
        showNewGroup.value = false;
        await loadChats();
        await selectChat(chat.id);
      } catch (err) {
        chatFormError.value = err.message;
      }
    }

    // ---------------------------------------------------------------
    // Sending a message (over the WebSocket, per the real /ws protocol)
    // ---------------------------------------------------------------
    function sendMessage() {
      const content = messageInput.value.trim();
      if (!content || !activeChatId.value) return;
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        logError('cannot send - WebSocket is not connected (status:', wsStatus.value, ')');
        return;
      }
      const payload = {
        type: 'send_message',
        chat_id: activeChatId.value,
        client_message_id: crypto.randomUUID(),
        content,
        message_type: 1,
      };
      log('WS →', payload);
      ws.send(JSON.stringify(payload));
      messageInput.value = '';
    }

    // ---------------------------------------------------------------
    // Lifecycle
    // ---------------------------------------------------------------
    watch(apiBase, (v) => localStorage.setItem('linka_api_base', v));

    onMounted(async () => {
      if (accessToken.value) {
        try {
          currentUser.value = await apiFetch('/users/me');
          log('resumed session as', currentUser.value);
          connectWebSocket();
          await loadChats();
        } catch (err) {
          logError('stored session is invalid, logging out:', err.message);
          logout();
        }
      }
    });

    onBeforeUnmount(() => disconnectWebSocket());

    return {
      apiBase, isAuthed, currentUser,
      authStage, phoneNumber, otpCode, authError, authBusy, requestOtp, verifyOtp, logout,
      wsStatus,
      chats, activeChatId, activeChatLabel, chatDisplayName, senderLabel, formatChatTime, messages, messageInput, chatsError, messagesError, messagesEl,
      activeChatIsGroup, visibleActiveChatMembers, hiddenActiveChatMemberCount, memberDisplayName, roleLabel,
      activeChatPresenceLabel,
      activeChatTypingLabel, notifyTyping,
      selectChat, sendMessage, statusTickSymbol, statusTickClass,
      showNewPrivate, showNewGroup, newPrivatePhone, newGroupTitle, newGroupMemberPhones, chatFormError,
      createPrivateChat, createGroupChat,
      showMembersModal, openMembersModal, addMemberPhone, membersModalError, membersModalBusy,
      canManageActiveChatMembers, addMemberToActiveGroup, activeChatMembers,
      canChangeActiveChatRoles, toggleMemberAdmin,
      memberOptionsFor, openMemberOptions, memberOptionMakeOrRemoveAdmin, memberOptionRemoveFromGroup, canRemoveMember, hasMemberOptions,
      leaveGroupBusy, leaveActiveGroup, startLeaveGroup, showOwnerTransferPicker, ownerTransferTargetId,
      otherActiveChatMembers, cancelOwnerTransferPicker, confirmLeaveWithTransfer,
      systemMessageText, shouldShowSystemMessage,
      toasts,
    };
  },

  template: `
    <AuthScreen v-if="!isAuthed"
      v-model:apiBase="apiBase" v-model:phoneNumber="phoneNumber" v-model:otpCode="otpCode"
      :authStage="authStage" :authError="authError" :authBusy="authBusy"
      @request-otp="requestOtp" @verify-otp="verifyOtp" @back-to-phone="authStage = 'phone'" />

    <div class="h-full flex flex-col" v-else>
      <AppHeader :wsStatus="wsStatus" :currentUser="currentUser" @logout="logout" />

      <div class="flex flex-1 min-h-0">
        <ChatSidebar
          v-model:showNewPrivate="showNewPrivate" v-model:showNewGroup="showNewGroup"
          v-model:newPrivatePhone="newPrivatePhone" v-model:newGroupTitle="newGroupTitle"
          v-model:newGroupMemberPhones="newGroupMemberPhones"
          :chatFormError="chatFormError" :chatsError="chatsError" :chats="chats" :activeChatId="activeChatId"
          :chatDisplayName="chatDisplayName" :formatChatTime="formatChatTime"
          @create-private-chat="createPrivateChat" @create-group-chat="createGroupChat"
          @select-chat="selectChat" />

        <main class="flex-1 flex flex-col min-w-0">
          <template v-if="activeChatId">
            <ChatHeader
              :activeChatLabel="activeChatLabel" :activeChatIsGroup="activeChatIsGroup"
              :visibleActiveChatMembers="visibleActiveChatMembers"
              :hiddenActiveChatMemberCount="hiddenActiveChatMemberCount"
              :memberDisplayName="memberDisplayName" :activeChatPresenceLabel="activeChatPresenceLabel"
              :activeChatTypingLabel="activeChatTypingLabel"
              @open-members-modal="openMembersModal" />

            <MessageList ref="messagesEl"
              :messages="messages" :messagesError="messagesError" :currentUser="currentUser"
              :shouldShowSystemMessage="shouldShowSystemMessage" :systemMessageText="systemMessageText"
              :senderLabel="senderLabel" :statusTickSymbol="statusTickSymbol" :statusTickClass="statusTickClass" />

            <MessageInput v-model:messageInput="messageInput" @send-message="sendMessage" @typing="notifyTyping" />
          </template>
          <div v-else class="flex-1 flex items-center justify-center text-slate-400 text-sm">
            Select a chat, or create one from the sidebar.
          </div>
        </main>
      </div>
    </div>

    <MembersModal v-if="showMembersModal"
      :activeChatLabel="activeChatLabel" :activeChatMembers="activeChatMembers"
      :memberDisplayName="memberDisplayName" :roleLabel="roleLabel"
      :hasMemberOptions="hasMemberOptions" :memberOptionsFor="memberOptionsFor"
      :canChangeActiveChatRoles="canChangeActiveChatRoles" :canRemoveMember="canRemoveMember"
      :showOwnerTransferPicker="showOwnerTransferPicker" :leaveGroupBusy="leaveGroupBusy"
      v-model:ownerTransferTargetId="ownerTransferTargetId" :otherActiveChatMembers="otherActiveChatMembers"
      :canManageActiveChatMembers="canManageActiveChatMembers"
      v-model:addMemberPhone="addMemberPhone" :membersModalBusy="membersModalBusy" :membersModalError="membersModalError"
      @close="showMembersModal = false"
      @open-member-options="openMemberOptions"
      @member-option-make-or-remove-admin="memberOptionMakeOrRemoveAdmin"
      @member-option-remove-from-group="memberOptionRemoveFromGroup"
      @start-leave-group="startLeaveGroup"
      @confirm-leave-with-transfer="confirmLeaveWithTransfer"
      @cancel-owner-transfer-picker="cancelOwnerTransferPicker"
      @add-member-to-active-group="addMemberToActiveGroup" />

    <ToastList :toasts="toasts" />
  `,
}).mount('#app');
</script>
</body>
</html>
